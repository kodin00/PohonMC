name: Package for Linux
description: Create Linux packages for PohonMC

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: Linux
  qt-version:
    description: Version of Qt to use
    required: true
  gpg-private-key:
    description: Private key for AppImage signing
    required: false
  gpg-private-key-id:
    description: ID for the gpg-private-key, to select the signing key
    required: false

runs:
  using: composite

  steps:
    - name: Cleanup Qt installation on Linux
      shell: bash
      run: |
        rm -rf "$QT_PLUGIN_PATH"/printsupport
        rm -rf "$QT_PLUGIN_PATH"/sqldrivers
        rm -rf "$QT_PLUGIN_PATH"/help
        rm -rf "$QT_PLUGIN_PATH"/designer
        rm -rf "$QT_PLUGIN_PATH"/qmltooling
        rm -rf "$QT_PLUGIN_PATH"/qmlls
        rm -rf "$QT_PLUGIN_PATH"/qmllint
        rm -rf "$QT_PLUGIN_PATH"/platformthemes/libqgtk3.so

    - name: Setup build variables
      shell: bash
      run: |
        # Fixup architecture naming for AppImages
        dpkg_arch="$(dpkg-architecture -q DEB_HOST_ARCH_CPU)"
        case "$dpkg_arch" in
          "amd64")
            APPIMAGE_ARCH="x86_64"
            ;;
          "arm64")
            APPIMAGE_ARCH="aarch64"
            ;;
          *)
            echo "# 🚨 The Debian architecture \"$dpkg_arch\" is not recognized!" >> "$GITHUB_STEP_SUMMARY"
            exit 1
            ;;
        esac
        echo "APPIMAGE_ARCH=$APPIMAGE_ARCH" >> "$GITHUB_ENV"

        # Used for the file paths of libraries
        echo "DEB_HOST_MULTIARCH=$(dpkg-architecture -q DEB_HOST_MULTIARCH)" >> "$GITHUB_ENV"

    - name: Package AppImage
      shell: bash
      env:
        VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        BUILD_DIR: build
        BUILD_TYPE: ${{ inputs.build-type }}
        INSTALL_APPIMAGE_DIR: install-appdir
        REF_TYPE: ${{ github.ref_type }}
        UPDATE_OWNER: ${{ github.repository_owner }}
        UPDATE_REPO: ${{ github.event.repository.name }}

        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        GPG_PRIVATE_KEY_ID: ${{ inputs.gpg-private-key-id }}
      run: |
        cmake --install "$BUILD_DIR" --config "$BUILD_TYPE" --prefix "$INSTALL_APPIMAGE_DIR"

        # mkappimage (go-appimage) has no signing flag. It signs the AppImage
        # whenever privkey.asc and pubkey.asc are in the working directory,
        # embeds pubkey.asc, and deletes privkey.asc once it has signed. The
        # next step removes privkey.asc if anything fails before that.
        if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PRIVATE_KEY_ID" ]; then
          (umask 077 && printf '%s\n' "$GPG_PRIVATE_KEY" > privkey.asc)
          # Throwaway keyring, only used to export the matching public key
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")"
          export GNUPGHOME
          gpg --import privkey.asc
          gpg --export --armor "$GPG_PRIVATE_KEY_ID" > pubkey.asc
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
          unset GNUPGHOME
          if [ ! -s pubkey.asc ]; then
            echo "::error::No public key exported for the configured AppImage signing key ID"
            exit 1
          fi
        else
          echo ":warning: Skipped code signing for Linux AppImage, as gpg key was not present." >> "$GITHUB_STEP_SUMMARY"
        fi

        sharun lib4bin \
          --hard-links \
          --with-hooks \
          --dst-dir "$INSTALL_APPIMAGE_DIR" \
          "$INSTALL_APPIMAGE_DIR"/bin/* "$QT_PLUGIN_PATH"/*/*.so

        cp ~/bin/AppImageUpdate.AppImage "$INSTALL_APPIMAGE_DIR"/bin/
        # FIXME(@getchoo): gamemode doesn't seem to be very portable with DBus. Find a way to make it work!
        find "$INSTALL_APPIMAGE_DIR" -name '*gamemode*' -exec rm {} +

        #disable OpenGL and Vulkan launcher features until https://github.com/VHSgunzo/sharun/issues/35
        echo "POHONMC_DISABLE_GLVULKAN=1" >> "$INSTALL_APPIMAGE_DIR"/.env
        #makes the launcher use portals for file picking
        echo "QT_QPA_PLATFORMTHEME=xdgdesktopportal" >> "$INSTALL_APPIMAGE_DIR"/.env
        ln -s io.github.kodin00.PohonMCLauncher.metainfo.xml "$INSTALL_APPIMAGE_DIR"/share/metainfo/io.github.kodin00.PohonMCLauncher.appdata.xml
        ln -s share/applications/io.github.kodin00.PohonMCLauncher.desktop "$INSTALL_APPIMAGE_DIR"
        ln -s share/icons/hicolor/256x256/apps/io.github.kodin00.PohonMCLauncher.png "$INSTALL_APPIMAGE_DIR"
        mv "$INSTALL_APPIMAGE_DIR"/{sharun,AppRun}
        ls -la "$INSTALL_APPIMAGE_DIR"

        if [[ "$REF_TYPE" == "tag" ]]; then
          APPIMAGE_DEST="PohonMC-Linux-$APPIMAGE_ARCH.AppImage"
        else
          APPIMAGE_DEST="PohonMC-Linux-$VERSION-$BUILD_TYPE-$APPIMAGE_ARCH.AppImage"
        fi

        mkappimage \
          --updateinformation "gh-releases-zsync|$UPDATE_OWNER|$UPDATE_REPO|latest|PohonMC-Linux-$APPIMAGE_ARCH.AppImage.zsync" \
          "$INSTALL_APPIMAGE_DIR" \
          "$APPIMAGE_DEST"

    - name: Remove AppImage signing key
      if: ${{ always() }}
      shell: bash
      run: |
        rm -f privkey.asc

    - name: Package portable tarball
      shell: bash
      env:
        BUILD_DIR: build
        BUILD_TYPE: ${{ inputs.build-type }}

        INSTALL_PORTABLE_DIR: install-portable
      run: |
        cmake --install "$BUILD_DIR" --config "$BUILD_TYPE" --prefix "$INSTALL_PORTABLE_DIR"
        cmake --install "$BUILD_DIR" --config "$BUILD_TYPE" --prefix "$INSTALL_PORTABLE_DIR" --component portable

        sharun lib4bin \
          --with-hooks \
          --hard-links \
          --dst-dir "$INSTALL_PORTABLE_DIR" \
          "$INSTALL_PORTABLE_DIR"/bin/* "$QT_PLUGIN_PATH"/*/*.so

        # FIXME(@getchoo): gamemode doesn't seem to be very portable with DBus. Find a way to make it work!
        find "$INSTALL_PORTABLE_DIR" -name '*gamemode*' -exec rm {} +

        for l in $(find ${{ env.INSTALL_PORTABLE_DIR }} -type f -o -type l); do l=${l#$(pwd)/}; l=${l#${{ env.INSTALL_PORTABLE_DIR }}/}; l=${l#./}; echo $l; done > ${{ env.INSTALL_PORTABLE_DIR }}/manifest.txt
        cd ${{ env.INSTALL_PORTABLE_DIR }}
        tar -czf ../PohonMC-portable.tar.gz *

    - name: Upload binary tarball
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: PohonMC-${{ inputs.artifact-name }}-Qt6-Portable-${{ inputs.version }}-${{ inputs.build-type }}
        path: PohonMC-portable.tar.gz

    - name: Upload AppImage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: PohonMC-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage
        path: PohonMC-${{ runner.os }}-*${{ env.APPIMAGE_ARCH }}.AppImage

    - name: Upload AppImage Zsync
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: PohonMC-${{ runner.os }}-${{ inputs.version }}-${{ inputs.build-type }}-${{ env.APPIMAGE_ARCH }}.AppImage.zsync
        path: PohonMC-${{ runner.os }}-*${{ env.APPIMAGE_ARCH }}.AppImage.zsync
