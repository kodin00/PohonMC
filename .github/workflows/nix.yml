name: Nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "develop"
      - "release-*"
    tags:
      - "*"
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"
      - "**.md"

      # Build files
      - "**.nix"
      - "nix/**"
      - "flake.lock"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"

      # Workflows
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"
      - "**.md"

      # Build files
      - "**.nix"
      - "nix/**"
      - "flake.lock"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"

      # Workflows
      - ".github/workflows/nix.yml"
  workflow_dispatch:
    inputs:
      release-build:
        description: Build release packages without pushing a release tag
        type: boolean
        default: false

permissions: {}

env:
  DEBUG: ${{ github.ref_type != 'tag' && !inputs.release-build }}

jobs:
  build:
    name: Build (${{ matrix.system }})

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            system: x86_64-linux

          - os: ubuntu-22.04-arm
            system: aarch64-linux

          - os: macos-26
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

        # For PRs
      - name: Setup Nix Magic Cache
        if: ${{ github.event_name == 'pull_request' }}
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

      - name: Check Cachix configuration
        id: cachix
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$CACHE_NAME" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ -n "$AUTH_TOKEN" ]; then
              echo "can_pin=true" >> "$GITHUB_OUTPUT"
            fi
          fi

        # Optional cache for in-tree builds
      - name: Setup Cachix
        if: ${{ steps.cachix.outputs.configured == 'true' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run Flake checks
        run: |
          nix flake check --print-build-logs --show-trace

      - name: Build debug package
        if: ${{ env.DEBUG == 'true' }}
        run: |
          nix build \
            --no-link --print-build-logs --print-out-paths \
            .#prismlauncher-debug >> "$GITHUB_STEP_SUMMARY"

      - name: Build release package
        if: ${{ env.DEBUG == 'false' }}
        run: |
          nix build --no-link --print-build-logs --print-out-paths .#prismlauncher \
            | tee "$RUNNER_TEMP/nix-release-paths" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin release package in Cachix
        if: ${{ github.ref_type == 'tag' && steps.cachix.outputs.can_pin == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
          SYSTEM: ${{ matrix.system }}
          CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          xargs cachix pin "$CACHE_NAME" "$TAG"-"$SYSTEM" < "$RUNNER_TEMP/nix-release-paths"
